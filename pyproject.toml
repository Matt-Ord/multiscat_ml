[project]
name = "multiscat_ml"
version = "0.0.1"
description = "Machine learning to solve the scattering problem."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.10.8",
    "multiscat",
    "torch>=2.12.0,<3.0.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest >=9.0.0,<10.0.0",
    "sphinx >=9.0.0,<10.0.0",
    "pydata-sphinx-theme >=0.19.0,<0.20.0",
    "ty>=0.0.50",
]


[tool.ruff]
unsafe-fixes = true
exclude = [".git", ".git-rewrite", ".vscode"]

[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = [
    "COM812",
    "E501",
    "S101",
    "PT009",
    "D100",
    "D105",
    "CPY001",
    "TD003",
    "TD002",
    "DOC201",
    "DOC402",
    "PD",
    "ERA001",
]
fixable = ["ALL"]
unfixable = ["T201"]


[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*" = ["PLR6301", "PLR0914", "D101", "D102", "D103", "D104"]
"examples/**/*" = ["INP001", "T201"]
"scripts/**/*" = ["INP001", "T201", "D101", "D102", "D103", "D104"]
"docs/**/*" = ["INP001", "I002"]

[tool.ruff.lint.pylint]
allow-dunder-method-names = [
    "__as_fundamental__",
    "__from_fundamental__",
    "__into_fundamental__",
    "__as_transformed__",
    "__into_transformed__",
    "__from_transformed__",
    "__convert_vector_into__",
    "__into_inner__",
    "__from_inner__",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["tests", "multiscat_ml", "examples"]
reportImplicitOverride = true
reportUnknownMemberType = false

[tool.setuptools.packages.find]
include = ["multiscat_ml", "multiscat_ml.*"]

[tool.uv.sources]
multiscat = { git = "https://github.com/Matt-Ord/multiscat.git" }


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
